plugins {
    id 'com.android.application'
}

android {
    namespace 'org.radiowave.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.radiowave.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.9.2'
    implementation 'androidx.media3:media3-session:1.9.2'
    implementation 'com.frostwire:jlibtorrent:2.1.2.1'
    implementation 'com.frostwire:jlibtorrent-android-arm64:2.1.2.1'
    implementation 'com.frostwire:jlibtorrent-android-x86_64:2.1.2.1'
    testImplementation 'junit:junit:4.13.2'
}
